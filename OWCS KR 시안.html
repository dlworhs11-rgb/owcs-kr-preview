<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>OWCS KR 시안 비교</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
:root{--bg:#F1EDE5;--panel:#FFFFFF;--line:#E6E6E1;--ink:#0B0B0F;--mute:#55555C;--dim:#6B6B72;--ac:#7D39EB;--ac2:#C6FF33;--red:#D92D20;--soft:#F6F6F3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  background-image:repeating-linear-gradient(135deg,rgba(60,45,25,.043) 0 1px,transparent 1px 11px);background-attachment:fixed}
.disp{font-family:'Barlow Condensed',sans-serif;font-weight:800}
.wrap{max-width:1100px;margin:0 auto;padding:32px 24px 80px}
h1{font-size:48px;line-height:.9;margin:0 0 6px}
.lead{font-size:15px;color:var(--mute);margin:0 0 20px}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.sw button{height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:15px;font-weight:800;cursor:pointer}
.sw button.on{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.opt{margin-bottom:48px}
.opt>h2{display:flex;align-items:baseline;gap:12px;margin:0 0 12px;font-size:24px}
.opt>h2 span{font-size:14px;font-weight:600;color:var(--mute)}
i.lg{display:block;flex:none;width:26px;height:26px;background:center/contain no-repeat}
i.lg.tbd{background:#C9C9CF;border-radius:5px}
.card{background:var(--panel);border-radius:22px;overflow:hidden}

/* ---------- A. 순위 사다리 ---------- */
.ld-h,.ld-r{display:grid;grid-template-columns:52px minmax(0,1fr) 150px 170px;align-items:center;gap:12px;padding:0 22px}
.ld-h{height:44px;font-size:12px;font-weight:700;color:var(--dim);border-bottom:1px solid var(--line)}
.ld-r{height:62px;border-top:1px solid var(--line)}
.ld-h+.ld-r,.ld-cut+.ld-r{border-top:0}
.ld-r .rk{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:28px;line-height:1}
.ld-r .tm{display:flex;align-items:center;gap:10px;min-width:0}
.ld-r .tm b{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:24px;line-height:1}
.ld-r .tm small{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ld-r .rec{font-size:14px;font-weight:600;color:var(--mute)}
.ld-r.out{opacity:.45}
.ld-cut{display:flex;align-items:center;gap:10px;padding:14px 22px 8px;font-size:12.5px;font-weight:800;color:var(--dim);background:var(--soft);border-top:1px solid var(--line)}
.ld-cut:after{content:"";flex:1;border-top:1px dashed #C9C9C3}
.dst{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:800;white-space:nowrap}
.dst:before{content:"";width:9px;height:9px;border-radius:50%;flex:none}
.dst.sf:before{background:var(--ink)}
.dst.qf:before{border:2px solid var(--ink);box-sizing:border-box}
.dst.wait{color:var(--mute);font-weight:700}
.dst.wait:before{background:#C9C9CF}
.dst.ko{color:var(--mute)}
.dst.ko:before{content:"×";width:auto;height:auto;border-radius:0;font-size:15px;line-height:1}
.dst small{font-size:12px;font-weight:600;color:var(--dim)}

/* ---------- B. 진출 경로 지도 ---------- */
.map{padding:22px}
.lane{display:grid;grid-template-columns:minmax(0,190px) 28px minmax(0,1fr) 28px minmax(0,220px);align-items:center;gap:0;padding:18px 0}
.lane+.lane{border-top:1px solid var(--line)}
.lane .lt{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.lane .lt b{font-size:17px;font-weight:800}
.lane .lt span{font-size:13px;color:var(--mute)}
.from{display:flex;flex-direction:column;gap:6px}
.from div{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;background:var(--soft)}
.from u{text-decoration:none;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;width:18px}
.from b{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px}
.from i.lg{width:22px;height:22px}
.ar{display:grid;place-items:center;color:#B5B5AE;font-size:20px;font-weight:800}
.mid{display:flex;flex-direction:column;gap:8px}
.mm{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;padding:10px 12px;border-radius:14px;border:1px solid var(--line)}
.mm .h{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--mute)}
.mm .t{display:flex;align-items:center;gap:7px;min-width:0}
.mm .t.r{justify-content:flex-end}
.mm .t b{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;white-space:nowrap}
.mm .t i.lg{width:22px;height:22px}
.mm .t.l0{opacity:.4}
.mm .s{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:19px;color:var(--dim)}
.mm .if{grid-column:1/-1;font-size:12px;color:var(--dim)}
.rr6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.rr6 .mm{padding:8px 9px;gap:4px}
.rr6 .mm .t b{font-size:16px}
.rr6 .mm .t i.lg{width:18px;height:18px}
.rr6 .mm .s{font-size:16px}
.to{display:flex;flex-direction:column;gap:8px}
.bk{padding:10px 12px;border-radius:14px;border:1.5px solid var(--ink)}
.bk.ko{border:1.5px dashed #B5B5AE;color:var(--mute)}
.bk .k{font-size:13px;font-weight:800;margin-bottom:8px}
.bk .ss{display:flex;gap:6px;flex-wrap:wrap}
.bk .ss span{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px 0 6px;border-radius:999px;background:var(--soft);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px}
.bk .ss span.e{width:72px;background:transparent;border:1px dashed #C9C9C3}
.bk .ss i.lg{width:22px;height:22px}

@media (max-width:899.98px){
  .wrap{padding:24px 16px 64px}
  h1{font-size:38px}
  .ld-h,.ld-r{grid-template-columns:34px minmax(0,1fr) auto;padding:0 14px;gap:8px}
  .ld-h .c3,.ld-r .rec{display:none}
  .ld-r{height:58px}
  .ld-r .rk{font-size:24px}
  .ld-r .tm b{font-size:21px}
  .ld-r .tm small{display:none}
  .ld-cut{padding:12px 14px 6px}
  .map{padding:14px}
  .lane{grid-template-columns:minmax(0,1fr)}
  .ar{transform:rotate(90deg);height:26px}
  .from{flex-direction:row;flex-wrap:wrap}
  .from div{flex:1 1 calc(50% - 6px)}
  .rr6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .to{flex-direction:row}
  .to .bk{flex:1;min-width:0}
}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="disp">시드 결정전 · LCQ 시안</h1>
  <p class="lead">두 방식을 같은 데이터로 그렸어요. 끝난 모습은 "지난 시즌 S2"를 눌러 보세요.</p>
  <div class="sw" id="sw"><button data-k="cur" class="on">이번 시즌 (경기 전)</button><button data-k="past">지난 시즌 S2 (끝난 모습)</button></div>
  <section class="opt"><h2>A. 순위 사다리<span>1~9위 한 표, 오른쪽에 갈 곳</span></h2><div class="card" id="a"></div></section>
  <section class="opt"><h2>B. 진출 경로 지도<span>왼쪽 순위 → 경기 → 도착</span></h2><div class="card map" id="b"></div></section>
</div>
<script src="./owcs-data.js?v=1020032902"></script>
<script>
(function () {
  var D = window.OWCS || { teams: [], matches: [] };
  var TEAM = {}; (D.teams || []).forEach(function (t) { TEAM[t.a] = t; });
  var byId = {}; (D.matches || []).forEach(function (m) { byId[m.id] = m; });
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var logo = function (a) { var t = TEAM[a]; return t && t.logo ? '<i class="lg" style="background-image:url(\'' + esc(t.logo) + '\')"></i>' : '<i class="lg tbd"></i>'; };

  // a stage's seeding deciders and LCQ: teams by place, matches with scores (live ones from D.matches)
  function road(S, cur) {
    var col = function (k) { var c = S.columns.find(function (c) { return c.key === k; }); return c ? c.matches : []; };
    var mt = function (x) {
      var m = byId[x.id], r = x.rows.map(function (r) { return { a: r.a, s: r.s }; });
      if (m) { r[0].a = m.a; r[1].a = m.b; if (m.played || m.live) { r[0].s = m.sa; r[1].s = m.sb; } }
      var played = m ? m.played : x.played != null ? x.played : r[0].s != null && r[1].s != null && (r[0].s || r[1].s);
      return { round: x.round, when: x.when, bo: (m && m.bo) || x.bo, rows: r, played: !!played,
        win: played ? (+r[0].s > +r[1].s ? r[0].a : r[1].a) : null, lose: played ? (+r[0].s > +r[1].s ? r[1].a : r[0].a) : null };
    };
    var seed = col('seed').map(mt), lcq = col('lcq').map(mt);
    var find = function (re) { return lcq.find(function (x) { return re.test(x.round); }); };
    var up = find(/승자조 결승/), semi = find(/패자조 준결승/), fin = find(/패자조 결승/);
    var st = cur ? (D.standings || []).map(function (s) { return s.a; }) : [];
    var top = S.seeding && S.seeding.length ? S.seeding.map(function (t) { return t.a; }) : st.slice(0, 4);
    var low = cur ? st.slice(4, 8) : [up.rows[0].a, up.rows[1].a, semi.rows[0].a, semi.rows[1].a];
    var out9 = cur ? st.slice(8) : [];
    // decider record per team (the seeding table when it is there, otherwise counted from the matches)
    var rec = {};
    top.forEach(function (a) { rec[a] = [0, 0]; });
    seed.forEach(function (x) { if (x.played && rec[x.win]) { rec[x.win][0]++; rec[x.lose][1]++; } });
    return { top: top, low: low, out9: out9, seed: seed, up: up, semi: semi, fin: fin, rec: rec, seedDone: seed.length && seed.every(function (x) { return x.played; }) };
  }

  // where an LCQ team goes, from the three matches
  function lcqFate(R, a) {
    if (R.up.win === a || R.fin.win === a) return ['qf', '8강 진출', ''];
    if (R.semi.lose === a || R.fin.lose === a) return ['ko', '탈락', ''];
    if (R.up.lose === a) return ['wait', '패자조 결승', R.fin.played ? '' : '한 번 더'];
    if (R.semi.win === a) return ['wait', '패자조 결승', '한 번 더'];
    var i = R.low.indexOf(a);
    return ['wait', i < 2 ? '이기면 8강' : '지면 탈락', ''];
  }

  // ---------- A ----------
  function drawA(R) {
    var dst = function (c, t, s) { return '<span class="dst ' + c + '">' + esc(t) + (s ? ' <small>' + esc(s) + '</small>' : '') + '</span>'; };
    var row = function (rk, a, rc, d, cls) {
      var t = TEAM[a];
      return '<div class="ld-r ' + (cls || '') + '"><span class="rk">' + rk + '</span><div class="tm">' + logo(a) + '<b>' + esc(a) + '</b><small>' + esc(t ? t.ko || t.n : '') + '</small></div><span class="rec">' + esc(rc) + '</span>' + d + '</div>';
    };
    var h = '<div class="ld-h"><span>순위</span><span>팀</span><span class="c3">' + '기록' + '</span><span>갈 곳</span></div>';
    h += '<div class="ld-cut">시드 결정전 · 4팀 모두 플레이오프 · 1·2위 4강 직행</div>';
    h += R.top.map(function (a, i) {
      var r = R.rec[a] || [0, 0], played = r[0] + r[1];
      var d = R.seedDone ? (i < 2 ? dst('sf', '4강 직행') : dst('qf', '8강'))
        : played ? (i < 2 ? dst('sf', '4강 직행권', '지금') : dst('qf', '8강권', '지금'))
        : dst('wait', '플레이오프 확정', '자리 미정');
      return row(i + 1, a, played ? '결정전 ' + r[0] + '승 ' + r[1] + '패' : '결정전 전', d);
    }).join('');
    h += '<div class="ld-cut">라스트 찬스 예선 · 4팀 중 2팀만 8강</div>';
    h += R.low.map(function (a, i) {
      var f = lcqFate(R, a);
      var w = [R.up, R.semi, R.fin].filter(function (x) { return x.played && (x.win === a || x.lose === a); });
      var rc = w.length ? 'LCQ ' + w.filter(function (x) { return x.win === a; }).length + '승 ' + w.filter(function (x) { return x.lose === a; }).length + '패' : i < 2 ? '두 번 지면 탈락' : '한 번 지면 탈락';
      return row(i + 5, a, rc, dst(f[0], f[1], f[2]), f[0] === 'ko' ? 'out' : '');
    }).join('');
    if (R.out9.length) h += '<div class="ld-cut">정규 리그에서 끝</div>' + R.out9.map(function (a, i) { return row(i + 9, a, '', dst('ko', '탈락'), 'out'); }).join('');
    document.getElementById('a').innerHTML = h;
  }

  // ---------- B ----------
  function drawB(R) {
    var mm = function (x, ifs) {
      var r = x.rows, done = x.played;
      var t = function (k, right) {
        var cls = 't' + (right ? ' r' : '') + (done && x.lose === r[k].a ? ' l0' : '');
        var nm = r[k].a === 'TBD' ? '미정' : r[k].a;
        return '<div class="' + cls + '">' + (right ? '<b>' + esc(nm) + '</b>' + logo(r[k].a) : logo(r[k].a) + '<b>' + esc(nm) + '</b>') + '</div>';
      };
      return '<div class="mm"><div class="h"><span>' + esc(x.round) + '</span><span>' + esc(String(x.when || '').split(' ')[0]) + ' · BO' + (x.bo || 5) + '</span></div>' + t(0) +
        '<span class="s">' + (done ? esc(r[0].s) + ' : ' + esc(r[1].s) : 'vs') + '</span>' + t(1, true) + (ifs ? '<div class="if">' + esc(ifs) + '</div>' : '') + '</div>';
    };
    var from = function (list, base) { return '<div class="from">' + list.map(function (a, i) { return '<div><u>' + (base + i) + '</u>' + logo(a) + '<b>' + esc(a) + '</b></div>'; }).join('') + '</div>'; };
    var bucket = function (title, teams, n, ko) {
      var s = teams.map(function (a) { return '<span>' + logo(a) + esc(a) + '</span>'; });
      while (s.length < n) s.push('<span class="e"></span>');
      return '<div class="bk' + (ko ? ' ko' : '') + '"><div class="k">' + esc(title) + '</div><div class="ss">' + s.join('') + '</div></div>';
    };
    var sf = R.seedDone ? R.top.slice(0, 2) : [], qf = R.seedDone ? R.top.slice(2, 4) : [];
    var h = '<div class="lane"><div class="lt"><b>시드 결정전</b><span>1–4위 · 서로 한 번씩 · 정규 리그 승패 합산</span></div>' +
      from(R.top, 1) + '<div class="ar">→</div><div class="mid"><div class="rr6">' + R.seed.map(function (x) { return mm(x); }).join('') + '</div></div><div class="ar">→</div>' +
      '<div class="to">' + bucket('4강 직행', sf, 2) + bucket('8강부터', qf, 2) + '</div></div>';
    var go = [R.up.win, R.fin.win].filter(Boolean), ko = [R.semi.lose, R.fin.lose].filter(Boolean);
    h += '<div class="lane"><div class="lt"><b>라스트 찬스 예선</b><span>5–8위 · 4팀 중 2팀만</span></div>' +
      from(R.low, 5) + '<div class="ar">→</div><div class="mid">' +
      mm(R.up, '이기면 8강 · 지면 패자조 결승') + mm(R.semi, '이기면 패자조 결승 · 지면 탈락') + mm(R.fin, '이기면 8강 · 지면 탈락') +
      '</div><div class="ar">→</div><div class="to">' + bucket('8강 진출', go, 2) + bucket('탈락', ko, 2, true) + '</div></div>';
    document.getElementById('b').innerHTML = h;
  }

  var stages = { cur: D.bracket, past: (D.pastStages || [])[0] };
  function draw(k) {
    var R = road(stages[k], k === 'cur');
    drawA(R); drawB(R);
    Array.prototype.forEach.call(document.querySelectorAll('#sw button'), function (b) { b.classList.toggle('on', b.getAttribute('data-k') === k); });
    document.querySelector('#sw [data-k=past]').textContent = '지난 시즌 ' + (stages.past ? stages.past.label.replace(/^\d{4}\s*스테이지\s*/, 'S') : '') + ' (끝난 모습)';
  }
  document.getElementById('sw').onclick = function (e) { var b = e.target.closest('button'); if (b) draw(b.getAttribute('data-k')); };
  draw('cur');
})();
</script>
</body>
</html>
